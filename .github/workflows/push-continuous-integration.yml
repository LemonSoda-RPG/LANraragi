on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration_test_repository:
        description: 'Integration testing repository path'
        required: true
        default: 'psilabs-dev/aio-lanraragi'
      integration_test_ref:
        description: 'Integration testing repository git commit hash or branch'
        required: true
        default: '8f0993203d32045f5f808087065b19d6cd0bef94'

env:
  INTEGRATION_TEST_REPOSITORY: ${{ github.event.inputs.integration_test_repository || 'psilabs-dev/aio-lanraragi' }}
  INTEGRATION_TEST_REF: ${{ github.event.inputs.integration_test_ref || '8f2fba6cfc5f582e776615359113d9ff37218b3d' }}

name: "Continuous Integration \U0001F44C\U0001F440"
jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: npm
    - run: npm ci
    - run: npm run lint

  testSuite:
    name: Run Test Suite and Perl Critic
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build LRR Docker image
      uses: docker/build-push-action@v7
      with:
        file: ./tools/build/docker/Dockerfile
        tags: lanraragi:test
        outputs: type=docker
        cache-from: type=gha,scope=buildkit-linux-amd64
    - name: Copy tests
      run: cp -R tests .github/action-run-tests
    - name: LANraragi Test Suite
      uses: ./.github/action-run-tests
    - name: Perl Critic
      uses: Difegue/action-perlcritic@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          args: ./lib/* ./script/* ./tools/install.pl

  integrationTestsDocker:
    name: Run Docker Integration Tests
    runs-on: ubuntu-latest
    needs: testSuite
    steps:
      - name: Checkout LANraragi repository
        uses: actions/checkout@v6
        with:
          path: lanraragi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build LRR Docker image
        uses: docker/build-push-action@v7
        with:
          context: lanraragi
          file: lanraragi/tools/build/docker/Dockerfile
          tags: lanraragi:ci-${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/lanraragi-ci.tar
          cache-from: type=gha,scope=buildkit-linux-amd64
      - name: Load LRR Docker image
        run: docker load -i "${{ runner.temp }}/lanraragi-ci.tar"
      # A reused image name once made this job test the previous commit: the
      # build/load steps were green, but the container reported the version from
      # an older build (0.9.82 while the commit said 0.9.83). Verify the image we
      # are about to test matches the checkout, so a stale image fails here in
      # seconds instead of surfacing as unrelated test failures 22 minutes later.
      - name: Verify the built image matches this commit
        run: |
          expected=$(jq -r .version lanraragi/package.json)
          actual=$(docker run --rm --entrypoint sh "lanraragi:ci-${GITHUB_SHA}" \
            -c "sed -n 's/.*\"version\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p' package.json | head -1")
          echo "package.json says $expected, image says $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the loaded lanraragi image does not match this commit"
            exit 1
          fi
      - name: Checkout aio-lanraragi integration tests
        uses: actions/checkout@v6
        with:
          repository: ${{ env.INTEGRATION_TEST_REPOSITORY }}
          ref: ${{ env.INTEGRATION_TEST_REF }}
          path: aio-lanraragi
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Install workspace packages
        working-directory: aio-lanraragi
        run: |
          uv sync --all-packages
          uv run playwright install
      - name: Create staging directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/staging"
      - name: Run integration tests against local LANraragi build
        timeout-minutes: 70
        run: |
          cd aio-lanraragi/integration_tests
          export CI=true
          uv run pytest tests --log-cli-level=INFO \
            --image "lanraragi:ci-${GITHUB_SHA}" \
            --staging "$GITHUB_WORKSPACE/staging" \
            --server-logs "$GITHUB_WORKSPACE/server-logs" \
            --cache-backend valkey \
            --playwright \
            --no-rate-limit \
            --npseed 42
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-ubuntu
          path: ${{ github.workspace }}/server-logs/
          retention-days: 14

  # Windows 集成测试（integrationTestsWindows）已在本 fork 移除：
  # CI 只在 Linux 上跑（eslint / 测试套件 / Docker 集成测试）。
