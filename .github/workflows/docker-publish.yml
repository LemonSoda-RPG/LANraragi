# 构建本 fork 的生产镜像并推送到 Docker Hub。
#
# 与上游的 push-continous-delivery.yml 的区别：
#   - 只构建 linux/amd64（本仓库实际使用/部署的架构），因此几分钟就能跑完；
#     上游那条会构建 5 个平台（arm/v6、arm/v7、arm64、386、amd64）并推送到
#     difegue/lanraragi，本 fork 用不到，已改为仅手动触发。
#   - 使用 type=gha 构建缓存；第一次运行没有缓存会比较慢，之后 apk/CPAN/npm
#     这些层都能命中缓存。
#
# 需要配置两个仓库密钥（Settings → Secrets and variables → Actions）:
#   DOCKERHUB_USERNAME  Docker Hub 用户名（例如 charleshuang233）
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌（不是登录密码）
# 没配置时自动退化为"只构建、不推送"，不会让 fork 上出现莫名其妙的红叉。
#
# 镜像里内置的插件来自 Ougi 仓库（构建期取回，见 tools/build/docker/Dockerfile）。
# 需要可复现构建时，把 OUGI_REF 固定成某个 commit。
name: Docker image

on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 先判断是否配置了 Docker Hub 凭据，供后续 job 决定推不推
  credentials:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub 凭据已配置，用户名 $USERNAME"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN —— 本次只构建镜像，不推送。"
          fi

  build:
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: needs.credentials.outputs.configured == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        if: needs.credentials.outputs.configured == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/lanraragi
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: tools/build/docker/Dockerfile
          platforms: linux/amd64
          push: ${{ needs.credentials.outputs.configured == 'true' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags || 'lanraragi:ci' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lanraragi-amd64
          cache-to: type=gha,mode=max,scope=lanraragi-amd64
          build-args: |
            OUGI_REF=main
