# 构建本 fork 的生产镜像并推送。
#
# 推送目标有两个，都是"配了就推、没配就不推"，不会因为缺凭据而失败：
#   1. GHCR（GitHub 自带容器仓库）ghcr.io/<owner>/<IMAGE_NAME>
#      —— 用 Actions 内置的 GITHUB_TOKEN，**不需要任何额外配置**，push 即可用。
#      首次推送后包默认是 private，要给外部匿名拉取需在仓库 Packages 里改为 public。
#   2. Docker Hub <DOCKERHUB_USERNAME>/<IMAGE_NAME>
#      —— 需要仓库密钥（Settings → Secrets and variables → Actions）:
#           DOCKERHUB_USERNAME  Docker Hub 用户名
#           DOCKERHUB_TOKEN     Docker Hub 访问令牌（不是登录密码）
#      没配置时自动跳过，并在日志里给一条 notice。
#
# 与上游 push-continous-delivery.yml 的区别：只构建 linux/amd64（本仓库实际部署的
# 架构），用 type=gha 构建缓存；上游那条构建 5 个平台 + Windows MSI 并推
# difegue/lanraragi，本 fork 用不到，已改为仅手动触发。
#
# 镜像里内置的插件来自 Ougi（构建期取回，见 tools/build/docker/Dockerfile）。
# 需要可复现构建时把 OUGI_REF 固定为某个 commit。
name: Docker image

on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # 推 GHCR 需要

env:
  # 镜像名。要改成别的（例如 lanraragi-fork）只改这一行，
  # 推送目标会自动变成 <DOCKERHUB_USERNAME>/<IMAGE_NAME> 和 ghcr.io/<owner>/<IMAGE_NAME>。
  IMAGE_NAME: lanraragi

jobs:
  # 判断有没有配置 Docker Hub 凭据，供 build job 决定要不要一并推过去
  credentials:
    runs-on: ubuntu-latest
    outputs:
      dockerhub: ${{ steps.check.outputs.dockerhub }}
    steps:
      - id: check
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub 凭据已配置（用户 $USERNAME），将同时推送到 Docker Hub。"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN —— 只推送到 GHCR。"
          fi

  build:
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_CONFIGURED: ${{ needs.credentials.outputs.dockerhub }}
      # PR 只构建、不推送
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v6

      # GHCR 的镜像名必须全小写
      - name: Compute lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUSH == 'true' && env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 两个目标合成一次构建：GHCR 总是包含，Docker Hub 仅在配了凭据时加入
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: >-
            ${{ env.DOCKERHUB_CONFIGURED == 'true'
                && format('{0}/{2},ghcr.io/{1}/{2}', env.DOCKERHUB_USERNAME, steps.owner.outputs.name, env.IMAGE_NAME)
                || format('ghcr.io/{0}/{1}', steps.owner.outputs.name, env.IMAGE_NAME) }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: tools/build/docker/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags || 'lanraragi:ci' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lanraragi-amd64
          cache-to: type=gha,mode=max,scope=lanraragi-amd64
          build-args: |
            OUGI_REF=main
