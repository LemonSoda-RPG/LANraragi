# 上游的多架构发布流程：构建 5 个平台的镜像（arm/v6、arm/v7、arm64、386、amd64）
# 并推送到 difegue/lanraragi，另外还跑一次 Windows MSI 打包。
#
# 本 fork 不使用它：目标镜像不是我们的，而它会在每次 push 到 dev 时全部尝试一遍，
# 只会产生失败记录。日常发布走 .github/workflows/docker-publish.yml
# （linux/amd64，推到你自己的 Docker Hub）。
#
# 这里保留为手动触发，需要多架构时可以参考或手动运行；密钥名已与
# docker-publish.yml 统一为 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN。
on:
  workflow_dispatch:
env:
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lanraragi
  TAG: nightly
name: Continuous Delivery 
jobs:

  buildDockerArm:
    name: Build Docker Images (ARM)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/arm/v6
          - linux/arm/v7
          - linux/arm64
    steps:
    - uses: actions/checkout@v6
    - name: Docker builder
      uses: ./.github/actions/docker-builder
      with:
        platform: ${{ matrix.platform }}
        docker-username: ${{ secrets.DOCKERHUB_USERNAME }}
        docker-password: ${{ secrets.DOCKERHUB_TOKEN }}

  buildDockerx86:
    name: Build Docker Images (x86)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/386
          - linux/amd64
    steps:
    - uses: actions/checkout@v6
    - name: Docker builder
      uses: ./.github/actions/docker-builder
      with:
        platform: ${{ matrix.platform }}
        docker-username: ${{ secrets.DOCKERHUB_USERNAME }}
        docker-password: ${{ secrets.DOCKERHUB_TOKEN }}

  mergeDocker:
    name: Merge Docker Images
    runs-on: ubuntu-24.04
    needs:
      - buildDockerArm
      - buildDockerx86
    steps:
      - uses: actions/checkout@v6
      - name: Docker merge
        uses: ./.github/actions/docker-merge
        with:
          docker-username: ${{ secrets.DOCKERHUB_USERNAME }}
          docker-password: ${{ secrets.DOCKERHUB_TOKEN }}

  buildNightlyMSYS2:
    name: Build and export native Windows version
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: Setup MSYS2 UCRT64
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        cache: false
    - name: Install deps
      shell: msys2 {0}
      run: |
        ./tools/build/windows/install-deps.sh
    - name: Build
      shell: msys2 {0}
      run: |
        ./tools/build/windows/install.sh
        ./tools/build/windows/cleanup.sh
        ./tools/build/windows/create-dist.sh
    - name: Enable UTF-8
      run: ./tools/build/windows/utf8-support.ps1
    - name: Find MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Build MSI Installer
      run: |
        choco uninstall wixtoolset
        ./tools/build/windows/build-installer.ps1
    - name: Upload Installer
      uses: actions/upload-artifact@v7
      with:
        name: LANraragi.msi
        path: ./tools/build/windows/Karen/Setup/bin/LANraragi.msi
        if-no-files-found: error
