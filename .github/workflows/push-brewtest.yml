# 上游的 Homebrew 测试：在 macOS runner 上构建 brew formula。
# 本 fork 不在 CI 里跑 Homebrew（每次 push 都会占用 macOS runner 额度），
# 保留为手动触发，需要时再跑。tap 名已改成本 fork 的 owner。
on:
  workflow_dispatch:
name: "Test Homebrew"
jobs:
  testBrew:
    name: Test Homebrew version
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build and test bundled homebrew formula
      env:
        TAP: ${{ github.repository_owner }}/lanraragi
      run: |
        cd tools/build/homebrew
        brew tap-new "$TAP"
        brew trust "$TAP"

        echo "Replacing commit hash in formula with current hash $(git rev-parse --verify HEAD)"
        sed -i.bck "s/COMMIT_HASH/$(git rev-parse --verify HEAD)/" Lanraragi.rb

        echo "Copying test formula to custom tap to allow installation"
        TAP_DIR="$(brew --repository)/Library/Taps/$(echo "$TAP" | tr '[:upper:]' '[:lower:]' | tr '/' '/homebrew-')"
        cp Lanraragi.rb "$TAP_DIR/Formula/"

        brew install --force --verbose --build-from-source "$TAP/lanraragi"
        brew test --verbose "$TAP/lanraragi"
